<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biaya Kelas Pemantapan & Online - LPK IJEF Corp</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="page-header reveal">
    <div class="container">
      <h1>Biaya Kelas Pemantapan dan Kelas Online</h1>
      <p>Informasi Biaya Program Tambahan dan Belajar Jarak Jauh</p>
    </div>
  </section>

  <section class="section-content container" style="padding: 60px 20px; max-width: 900px;">
    <!-- Menggunakan align-items: stretch agar kedua card sejajar tingginya -->
    <div class="grid-biaya-tambahan" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; align-items: stretch;">
      
      <!-- Biaya Kelas Pemantapan -->
      <div class="reveal-up" style="background: #e2e8f0; padding: 30px; border-radius: 14px; border: 1.5px solid #cbd5e1; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <h2 style="color: #1e293b; font-size: 22px; margin-bottom: 15px; font-weight: 700;">
            <i class="fa-solid fa-graduation-cap" style="color: #0056b3; margin-right: 10px;"></i> Biaya Kelas Pemantapan
          </h2>
          <ul style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px;">
            <li style="background: #ffffff; padding: 14px 18px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #cbd5e1;">
              <span style="color: #334155; font-weight: 600;">Kelas SSW</span>
              <span style="color: #0284c7; font-weight: 700;">Rp 2.500.000</span>
            </li>
            <li style="background: #ffffff; padding: 14px 18px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #cbd5e1;">
              <span style="color: #334155; font-weight: 600;">Kelas Mensetsu</span>
              <span style="color: #0284c7; font-weight: 700;">Rp 1.000.000</span>
            </li>
          </ul>
        </div>
        <div style="text-align: center; margin-top: auto;">
          <a href="#kontak" class="btn-primary btn-admin-trigger" style="display: inline-block; background-color: #1e3a8a; color: white; padding: 10px 25px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 14px;">Daftar Kelas Pemantapan</a>
        </div>
      </div>

      <!-- Biaya Kelas Online -->
      <div class="reveal-up" style="background: #e2e8f0; padding: 30px; border-radius: 14px; border: 1.5px solid #cbd5e1; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <h2 style="color: #1e293b; font-size: 22px; margin-bottom: 15px; font-weight: 700;">
            <i class="fa-solid fa-laptop" style="color: #0056b3; margin-right: 10px;"></i> Biaya Kelas Online
          </h2>
          <div style="background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 25px;">
            <p style="font-size: 20px; color: #0284c7; font-weight: 700; margin-bottom: 8px;">Rp 3.000.000</p>
            <p style="color: #334155; font-size: 15px; line-height: 1.5; margin: 0;">
              <i class="fa-solid fa-clock" style="color: #64748b; margin-right: 6px;"></i> Durasi Pelatihan: <strong>Selama 2 Bulan</strong>
            </p>
          </div>
        </div>
        <div style="text-align: center; margin-top: auto;">
          <a href="#kontak" class="btn-primary btn-admin-trigger" style="display: inline-block; background-color: #1e3a8a; color: white; padding: 10px 25px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 14px;">Daftar Kelas Online</a>
        </div>
      </div>

    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const revealUpElements = document.querySelectorAll(".reveal-up");
      function checkRevealUp() {
        const triggerBottom = window.innerHeight * 0.85;
        revealUpElements.forEach((el) => {
          const boxTop = el.getBoundingClientRect().top;
          if (boxTop < triggerBottom) {
            el.classList.add("active");
          }
        });
      }
      window.addEventListener("scroll", checkRevealUp);
      checkRevealUp();
    });
  </script>

  <script src="global-layout.js"></script>
  <script src="script.js"></script>
</body>
</html>
