<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Google & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">

<body>

  <!-- Header Banner Subpage -->
  <section class="page-header reveal">
    <div class="container">
      <h1 data-i18n="lokasi_header_title">Lokasi Pendidikan & Pelatihan</h1>
      <p data-i18n="lokasi_header_desc">Pusat Kegiatan Belajar & Asrama LPK IJEF Corp</p>
    </div>
  </section>

  <!-- Alamat & Peta -->
  <main class="section-padding">
    <article id="lokasi" class="container">
      <div class="section-header reveal text-center">
        <h2 data-i18n="lokasi_section_title">Alamat Kantor & Pusat Pelatihan</h2>

      <!-- Wrapper dipusatkan menggunakan flexbox dan lebar maksimum agar rapi -->
      <div class="map-responsive reveal" style="margin-top: 20px; display: flex; justify-content: center; width: 100%;">
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d247.59645515178698!2d107.526162657037!3d-6.825264429407408!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e68e344a4656409%3A0xad10456097c85b6f!2sLPK%20IJEF%20CORP%20-%20International%20Japan%20Eco%20Future%20Corp!5e0!3m2!1sid!2sid!4v1786505486392!5m2!1sid!2sid" width="100%" height="450" style="border:0; max-width: 900px; border-radius: 8px;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </article>
  </main>

  <!-- Placeholder Footer untuk dynamic load dari global-layout.js -->
  <div id="footer-placeholder"></div>

  <!-- Pemanggilan translations.js dan global-layout.js -->
  <script src="translations.js"></script>
  <script src="global-layout.js"></script>
  <script src="script.js"></script>
</body>
</html>
